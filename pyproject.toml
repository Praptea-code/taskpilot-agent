[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskpilot-agent"
version = "0.1.0"
description = "Autonomous task execution agent with pluggable domains"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy[asyncio]>=2",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "apscheduler",
    "aiosmtplib",
    "python-dotenv",
]

[project.optional-dependencies]
voice = ["faster-whisper"]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "aiosqlite",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
